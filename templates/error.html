<h1>L'analyse a échoué</h1>
<p>
  Le détail est dans la sortie du serveur. Les deux causes habituelles :
  <code>OPENROUTER_API_KEY</code> absente du <code>.env</code>, ou
  <code>LLM_MODEL</code> qui pointe un modèle retiré d'OpenRouter.
</p>
